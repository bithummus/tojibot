name: Daily Toji Reading Message
on:
  schedule:
    - cron: '17 20 * * *'
      timezone: 'Asia/Seoul'
  workflow_dispatch:
    inputs:
      test_date:
        description: 'YYYY-MM-DD (optional)'
        required: false
        type: string
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Send
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TEST_DATE: ${{ inputs.test_date }}
        run: python bot.py
