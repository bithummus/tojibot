name: Daily Toji Reading Message

on:
  schedule:
    - cron: '7 9 * * *'
      timezone: 'Asia/Seoul'

    - cron: '17 20 * * *'
      timezone: 'Asia/Seoul'

    - cron: '*/5 * * * *'
      timezone: 'Asia/Seoul'

  workflow_dispatch:
    inputs:
      test_date:
        description: '테스트 날짜 (YYYY-MM-DD)'
        required: false
        type: string

      message_type:
        description: '테스트할 메시지'
        required: true
        default: 'morning'
        type: choice
        options:
          - morning
          - evening

jobs:
  send:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Determine message type
        id: message
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_TYPE: ${{ inputs.message_type }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "type=$INPUT_TYPE" >> "$GITHUB_OUTPUT"

          elif [ "$SCHEDULE" = "7 9 * * *" ]; then
            echo "type=morning" >> "$GITHUB_OUTPUT"

          elif [ "$SCHEDULE" = "17 20 * * *" ]; then
            echo "type=evening" >> "$GITHUB_OUTPUT"

          else
            echo "type=unknown" >> "$GITHUB_OUTPUT"
          fi

      - name: Send Discord message
        if: steps.message.outputs.type != 'unknown'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TEST_DATE: ${{ inputs.test_date }}
          MESSAGE_TYPE: ${{ steps.message.outputs.type }}
        run: python bot.py