name: Daily Toji Reading Message

on:
  schedule:
    # 매일 오전 9:07
    - cron: '7 9 * * *'
      timezone: 'Asia/Seoul'

    # 매일 오후 8:17
    - cron: '17 20 * * *'
      timezone: 'Asia/Seoul'

  workflow_dispatch:
    inputs:
      test_date:
        description: '테스트 날짜 (YYYY-MM-DD)'
        required: false
        type: string

      message_type:
        description: '테스트할 메시지'
        required: true
        default: 'morning'
        type: choice
        options:
          - morning
          - evening

jobs:
  send:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Send Discord message
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TEST_DATE: ${{ inputs.test_date }}
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_TYPE: ${{ inputs.message_type }}

        run: |
          echo "event=$EVENT_NAME"
          echo "schedule=$SCHEDULE"

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            MESSAGE_TYPE="$INPUT_TYPE"

          elif [ "$SCHEDULE" = "7 9 * * *" ]; then
            MESSAGE_TYPE="morning"

          elif [ "$SCHEDULE" = "17 20 * * *" ]; then
            MESSAGE_TYPE="evening"

          else
            echo "::error::알 수 없는 schedule: '$SCHEDULE'"
            exit 1
          fi

          echo "MESSAGE_TYPE=$MESSAGE_TYPE"

          MESSAGE_TYPE="$MESSAGE_TYPE" python bot.py